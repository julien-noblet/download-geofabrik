# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...
    - go run cmd/download-geofabrik/main.go generate
    - mkdir -p docs/catalogs
    - cat .README.md1 > README.md
    - go run cmd/download-geofabrik/main.go --help >> README.md
    - cat .README.md2 >> README.md
    - |
      cat << 'EOF' > docs/catalogs/geofabrik.md
      # Geofabrik Extracts Catalog

      [← Back to README](../../README.md)

      - **Service Key**: `geofabrik` (default)
      - **Description**: Continents, countries, and regional OpenStreetMap extracts
      - **Example**: `download-geofabrik download ile-de-france`

      ## Available Elements

      EOF
      go run cmd/download-geofabrik/main.go list --markdown >> docs/catalogs/geofabrik.md
    - |
      cat << 'EOF' > docs/catalogs/openstreetmap.fr.md
      # OpenStreetMap France Extracts Catalog

      [← Back to README](../../README.md)

      - **Service Key**: `openstreetmap.fr`
      - **Description**: High-detail extracts for French regions, departments, and worldwide extracts
      - **Example**: `download-geofabrik --service openstreetmap.fr download rhone-alpes`

      ## Available Elements

      EOF
      go run cmd/download-geofabrik/main.go --service "openstreetmap.fr" list --markdown >> docs/catalogs/openstreetmap.fr.md
    - |
      cat << 'EOF' > docs/catalogs/bbbike.md
      # BBBike Extracts Catalog

      [← Back to README](../../README.md)

      - **Service Key**: `bbbike`
      - **Description**: Extracts for 200+ major metropolitan cities worldwide
      - **Example**: `download-geofabrik --service bbbike download Berlin`

      ## Available Elements

      EOF
      go run cmd/download-geofabrik/main.go --service "bbbike" list --markdown >> docs/catalogs/bbbike.md
    - |
      cat << 'EOF' > docs/catalogs/geo2day.md
      # Geo2day Extracts Catalog

      [← Back to README](../../README.md)

      - **Service Key**: `geo2day`
      - **Description**: Custom regional and metropolitan extracts
      - **Example**: `download-geofabrik --service geo2day download bretagne`

      ## Available Elements

      EOF
      go run cmd/download-geofabrik/main.go --service "geo2day" list --markdown >> docs/catalogs/geo2day.md
    - |
      cat << 'EOF' > docs/catalogs/movisda.md
      # Movisda Extracts Catalog

      [← Back to README](../../README.md)

      - **Service Key**: `movisda`
      - **Description**: Worldwide country and administrative subdivision extracts
      - **Example**: `download-geofabrik --service movisda download fr-idf`

      ## Available Elements

      EOF
      go run cmd/download-geofabrik/main.go --service "movisda" list --markdown >> docs/catalogs/movisda.md
    - |
      cat << 'EOF' > docs/catalogs/planet.osm.ch.md
      # Planet OSM Switzerland Extracts Catalog

      [← Back to README](../../README.md)

      - **Service Key**: `planet.osm.ch`
      - **Description**: Switzerland national, cantonal, and cross-border extracts
      - **Example**: `download-geofabrik --service planet.osm.ch download switzerland`

      ## Available Elements

      EOF
      go run cmd/download-geofabrik/main.go --service "planet.osm.ch" list --markdown >> docs/catalogs/planet.osm.ch.md
    - |
      cat << 'EOF' > docs/catalogs/osm.kewl.lu.md
      # OSM Luxembourg Extracts Catalog

      [← Back to README](../../README.md)

      - **Service Key**: `osm.kewl.lu`
      - **Description**: Daily extracts for the Grand Duchy of Luxembourg
      - **Example**: `download-geofabrik --service osm.kewl.lu download luxembourg`

      ## Available Elements

      EOF
      go run cmd/download-geofabrik/main.go --service "osm.kewl.lu" list --markdown >> docs/catalogs/osm.kewl.lu.md
    - |
      cat << 'EOF' > docs/catalogs/osm.fit.vutbr.cz.md
      # FIT VUT Brno Extracts Catalog

      [← Back to README](../../README.md)

      - **Service Key**: `osm.fit.vutbr.cz`
      - **Description**: Czech Republic national and regional extracts
      - **Example**: `download-geofabrik --service osm.fit.vutbr.cz download czech-republic`

      ## Available Elements

      EOF
      go run cmd/download-geofabrik/main.go --service "osm.fit.vutbr.cz" list --markdown >> docs/catalogs/osm.fit.vutbr.cz.md
    - |
      cat << 'EOF' > docs/catalogs/osmit-estratti.md
      # OpenStreetMap Italia Extracts Catalog

      [← Back to README](../../README.md)

      - **Service Key**: `osmit-estratti`
      - **Description**: Italy national, regional, and provincial extracts
      - **Example**: `download-geofabrik --service osmit-estratti download toscana`

      ## Available Elements

      EOF
      go run cmd/download-geofabrik/main.go --service "osmit-estratti" list --markdown >> docs/catalogs/osmit-estratti.md
    - |
      cat << 'EOF' > docs/catalogs/osm.kcwu.csie.org.md
      # OSM Taiwan Extracts Catalog

      [← Back to README](../../README.md)

      - **Service Key**: `osm.kcwu.csie.org`
      - **Description**: Taiwan extracts and change history
      - **Example**: `download-geofabrik --service osm.kcwu.csie.org download taiwan`

      ## Available Elements

      EOF
      go run cmd/download-geofabrik/main.go --service "osm.kcwu.csie.org" list --markdown >> docs/catalogs/osm.kcwu.csie.org.md


builds:
  - main: ./cmd/download-geofabrik/main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
      - dragonfly
      - freebsd
      - illumos
      - netbsd
      - openbsd
      - solaris

    goarch:
      - amd64
      - 386
      - arm
      - arm64
      - loong64
      - mips
      - mips64
      - mips64le
      - mipsle
      - ppc64
      - ppc64le
      - riscv64
      - s390x

    #goamd64:
    #  - v1
    #  - v2
    #  - v3
    #  - v4

    goarm:
      - 5
      - 6
      - 7

    #go386:
    #  - sse2
    #  - softfloat
      
    #goppc64:
    #  - power8
    #  - power9
    
    #goriscv64:
    #  - rva20u64
    #  - rva22u64

    #gomips:
    #  - hardfloat
    #  - softfloat

    #goarm64:
    #  - v8.0
    #  - v9.0

    ignore:
      - goos: darwin
        goarch: 386
    
    tool: "go1.27.1"

    ldflags: >-
      -s -w
      -X main.version={{ .Version }}

universal_binaries:
  - replace: true

upx:
  - # Whether to enable it or not.
    #
    # Templates: allowed.
    enabled: false # remove upx since I've issues with antivirus software

    goos:
      - linux
      - windows

    # Compress argument.
    # Valid options are from '1' (faster) to '9' (better), and 'best'.
    compress: best

    # Whether to try LZMA (slower).
    lzma: true

    # Whether to try all methods and filters (slow).
    brute: true      

archives:
  - formats:
      - tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - license*
      - LICENSE*
      - README.md
      - changelog*
      - CHANGELOG*
      - bbbike.yml
      - geo2day.yml
      - geofabrik.yml
      - movisda.yml
      - openstreetmap.fr.yml
      - osm.fit.vutbr.cz.yml
      - osm.kcwu.csie.org.yml
      - osm.kewl.lu.yml
      - osmit-estratti.yml
      - planet.osm.ch.yml

nfpms:
  - id: packages
    package_name: download-geofabrik
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}"
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    maintainer: Julien Noblet <julien.noblet@gmail.com>
    description: A CLI tool for downloading OpenStreetMap data and extracts from multiple providers.
    homepage: https://github.com/julien-noblet/download-geofabrik
    license: MPL-2.0
    bindir: /usr/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/download-geofabrik/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/download-geofabrik/README.md
      - src: ./bbbike.yml
        dst: /etc/download-geofabrik/bbbike.yml
        type: config|noreplace
      - src: ./geo2day.yml
        dst: /etc/download-geofabrik/geo2day.yml
        type: config|noreplace
      - src: ./geofabrik.yml
        dst: /etc/download-geofabrik/geofabrik.yml
        type: config|noreplace
      - src: ./movisda.yml
        dst: /etc/download-geofabrik/movisda.yml
        type: config|noreplace
      - src: ./openstreetmap.fr.yml
        dst: /etc/download-geofabrik/openstreetmap.fr.yml
        type: config|noreplace
      - src: ./osm.fit.vutbr.cz.yml
        dst: /etc/download-geofabrik/osm.fit.vutbr.cz.yml
        type: config|noreplace
      - src: ./osm.kcwu.csie.org.yml
        dst: /etc/download-geofabrik/osm.kcwu.csie.org.yml
        type: config|noreplace
      - src: ./osm.kewl.lu.yml
        dst: /etc/download-geofabrik/osm.kewl.lu.yml
        type: config|noreplace
      - src: ./osmit-estratti.yml
        dst: /etc/download-geofabrik/osmit-estratti.yml
        type: config|noreplace
      - src: ./planet.osm.ch.yml
        dst: /etc/download-geofabrik/planet.osm.ch.yml
        type: config|noreplace

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers_v2:
  - images:
      - "ghcr.io/julien-noblet/{{.ProjectName}}"
    tags:
      - "latest"
      - "{{ .Tag }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - bbbike.yml
      - geo2day.yml
      - geofabrik.yml
      - movisda.yml
      - openstreetmap.fr.yml
      - osm.fit.vutbr.cz.yml
      - osm.kcwu.csie.org.yml
      - osm.kewl.lu.yml
      - osmit-estratti.yml
      - planet.osm.ch.yml