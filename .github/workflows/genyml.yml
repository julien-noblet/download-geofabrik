name: yml-generate
on:
  # pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * 0' # every Sunday at midnight
permissions:
  # contents permission to update benchmark contents in 'benchmarks' branch
  contents: write
jobs:
  yml-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build binary with Nix
        run: nix build
      - run: ./result/bin/download-geofabrik generate
      - run: ./result/bin/download-geofabrik --service="openstreetmap.fr" generate
      - run: ./result/bin/download-geofabrik --service="bbbike" generate
      - run: ./result/bin/download-geofabrik --service="geo2day" generate
      - run: ./result/bin/download-geofabrik --service="movisda" generate
      - run: ./result/bin/download-geofabrik --service="planet.osm.ch" generate
      - run: ./result/bin/download-geofabrik --service="osm.kewl.lu" generate
      - run: ./result/bin/download-geofabrik --service="osm.fit.vutbr.cz" generate
      - run: ./result/bin/download-geofabrik --service="osmit-estratti" generate
      - run: ./result/bin/download-geofabrik --service="osm.kcwu.csie.org" generate
      - run: mkdir -p docs/catalogs
      - run: cat .README.md1 > README.md
      - run: ./result/bin/download-geofabrik --help >> README.md
      - run: cat .README.md2 >> README.md
      - run: |
          cat << 'EOF' > docs/catalogs/geofabrik.md
          # Geofabrik Extracts Catalog

          [← Back to README](../../README.md)

          - **Service Key**: `geofabrik` (default)
          - **Description**: Continents, countries, and regional OpenStreetMap extracts
          - **Example**: `download-geofabrik download ile-de-france`

          ## Available Elements

          EOF
          ./result/bin/download-geofabrik list --markdown >> docs/catalogs/geofabrik.md
      - run: |
          cat << 'EOF' > docs/catalogs/openstreetmap.fr.md
          # OpenStreetMap France Extracts Catalog

          [← Back to README](../../README.md)

          - **Service Key**: `openstreetmap.fr`
          - **Description**: High-detail extracts for French regions, departments, and worldwide extracts
          - **Example**: `download-geofabrik --service openstreetmap.fr download rhone_alpes`

          ## Available Elements

          EOF
          ./result/bin/download-geofabrik --service "openstreetmap.fr" list --markdown >> docs/catalogs/openstreetmap.fr.md
      - run: |
          cat << 'EOF' > docs/catalogs/bbbike.md
          # BBBike Extracts Catalog

          [← Back to README](../../README.md)

          - **Service Key**: `bbbike`
          - **Description**: Extracts for 200+ major metropolitan cities worldwide
          - **Example**: `download-geofabrik --service bbbike download Berlin`

          ## Available Elements

          EOF
          ./result/bin/download-geofabrik --service "bbbike" list --markdown >> docs/catalogs/bbbike.md
      - run: |
          cat << 'EOF' > docs/catalogs/geo2day.md
          # Geo2day Extracts Catalog

          [← Back to README](../../README.md)

          - **Service Key**: `geo2day`
          - **Description**: Custom regional and metropolitan extracts
          - **Example**: `download-geofabrik --service geo2day download bretagne`

          ## Available Elements

          EOF
          ./result/bin/download-geofabrik --service "geo2day" list --markdown >> docs/catalogs/geo2day.md
      - run: |
          cat << 'EOF' > docs/catalogs/movisda.md
          # Movisda Extracts Catalog

          [← Back to README](../../README.md)

          - **Service Key**: `movisda`
          - **Description**: Worldwide country and administrative subdivision extracts
          - **Example**: `download-geofabrik --service movisda download fr-idf`

          ## Available Elements

          EOF
          ./result/bin/download-geofabrik --service "movisda" list --markdown >> docs/catalogs/movisda.md
      - run: |
          cat << 'EOF' > docs/catalogs/planet.osm.ch.md
          # Planet OSM Switzerland Extracts Catalog

          [← Back to README](../../README.md)

          - **Service Key**: `planet.osm.ch`
          - **Description**: Switzerland national, cantonal, and cross-border extracts
          - **Example**: `download-geofabrik --service planet.osm.ch download switzerland`

          ## Available Elements

          EOF
          ./result/bin/download-geofabrik --service "planet.osm.ch" list --markdown >> docs/catalogs/planet.osm.ch.md
      - run: |
          cat << 'EOF' > docs/catalogs/osm.kewl.lu.md
          # OSM Luxembourg Extracts Catalog

          [← Back to README](../../README.md)

          - **Service Key**: `osm.kewl.lu`
          - **Description**: Daily extracts for the Grand Duchy of Luxembourg
          - **Example**: `download-geofabrik --service osm.kewl.lu download luxembourg`

          ## Available Elements

          EOF
          ./result/bin/download-geofabrik --service "osm.kewl.lu" list --markdown >> docs/catalogs/osm.kewl.lu.md
      - run: |
          cat << 'EOF' > docs/catalogs/osm.fit.vutbr.cz.md
          # FIT VUT Brno Extracts Catalog

          [← Back to README](../../README.md)

          - **Service Key**: `osm.fit.vutbr.cz`
          - **Description**: Czech Republic national and regional extracts
          - **Example**: `download-geofabrik --service osm.fit.vutbr.cz download czech-republic`

          ## Available Elements

          EOF
          ./result/bin/download-geofabrik --service "osm.fit.vutbr.cz" list --markdown >> docs/catalogs/osm.fit.vutbr.cz.md
      - run: |
          cat << 'EOF' > docs/catalogs/osmit-estratti.md
          # OpenStreetMap Italia Extracts Catalog

          [← Back to README](../../README.md)

          - **Service Key**: `osmit-estratti`
          - **Description**: Italy national, regional, and provincial extracts
          - **Example**: `download-geofabrik --service osmit-estratti download toscana`

          ## Available Elements

          EOF
          ./result/bin/download-geofabrik --service "osmit-estratti" list --markdown >> docs/catalogs/osmit-estratti.md
      - run: |
          cat << 'EOF' > docs/catalogs/osm.kcwu.csie.org.md
          # OSM Taiwan Extracts Catalog

          [← Back to README](../../README.md)

          - **Service Key**: `osm.kcwu.csie.org`
          - **Description**: Taiwan extracts and change history
          - **Example**: `download-geofabrik --service osm.kcwu.csie.org download taiwan`

          ## Available Elements

          EOF
          ./result/bin/download-geofabrik --service "osm.kcwu.csie.org" list --markdown >> docs/catalogs/osm.kcwu.csie.org.md
      - run: rm -f result
      - uses: actions-js/push@master
        with:
          message: generate yaml files
          branch: new_yamls
          github_token: ${{ secrets.GITHUB_TOKEN }}
          rebase: true
          force: true
