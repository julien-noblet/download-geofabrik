name: Nix

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: 0

jobs:
  nix:
    name: Nix Flake Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check Flake
        run: nix flake check

      - name: Build Package
        run: nix build

      - name: Run App
        run: nix run . -- --version

  devenv:
    name: Devenv Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix (devenv)
        uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Run devenv test
        shell: bash
        run: devenv --no-tui test
