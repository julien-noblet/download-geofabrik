name: Build changelog
on:
    repository_dispatch:
        types: [ trigger-changelog-workflow ]
    workflow_dispatch:
        inputs:
            next_version:
                description: "Next version tag"
                required: false
            commit_message:
                description: "Commit message"
                required: false

jobs:
    package:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repo
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0
                    submodules: recursive
            -   uses: maicol07/github-changelog-action@patch-1
                with:
                    next_version: ${{ github.event.inputs.next_version }}
            -   uses: oleksiyrudenko/gha-git-credentials@v2.1
                with:
                    token: '${{ secrets.GITHUB_TOKEN }}'
            -   run: "git commit -m \"changelog: 🔖 Updated changelog for commit $GITHUB_SHA\" -a"
                if: ${{ !github.event.inputs.commit_message && !github.event.inputs.next_version }}
            -   env:
                    NEXT_VERSION: ${{ github.event.inputs.next_version }}
                run: 'git commit -m "release: 🔖 $NEXT_VERSION" -a'
                if: ${{ !github.event.inputs.commit_message && github.event.inputs.next_version }}
            -   env:
                    COMMIT_MESSAGE: ${{ github.event.inputs.commit_message }}
                run: 'git commit -m "$COMMIT_MESSAGE" -a'
                if: ${{ github.event.inputs.commit_message }}
            -   name: Push changes
                uses: ad-m/github-push-action@master
                with:
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    branch: ${{ github.ref }}
