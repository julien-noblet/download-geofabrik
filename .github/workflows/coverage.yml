name: "Go Coverage"
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      # It's important that the action also runs on merge to main
      - main
      - master
env:
  CGO_ENABLED: 0

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v7
      with:
        # default fetch-depth is insufficent to find previous coverage notes
        fetch-depth: 10

    - uses: cachix/install-nix-action@v32
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - uses: cachix/cachix-action@v17
      with:
        name: devenv
    - name: Install devenv
      run: nix profile add nixpkgs#devenv
    - name: Setup environment from devenv
      run: |
        set -o pipefail
        devenv --no-tui shell -- printenv PATH | tr ":" "\n" | while read -r p; do
          if [ -d "$p" ]; then
            echo "$p" >> "$GITHUB_PATH"
          fi
        done
        rm -f .git/hooks/pre-commit .git/hooks/pre-push .pre-commit-config.yaml

    - uses: gwatts/go-coverage-action@v2
      id: coverage
      continue-on-error: true
      with:
        # Optional coverage threshold
        # use fail-coverage to determine what should happen below this threshold
        coverage-threshold: 70

        # collect coverage for all packages beyond the one under test
        cover-pkg: ./...

        # Ignore code-generated files when calculating coverage totals
        ignore-pattern: |
          \.pb\.go$
          \_string\.go$

        # A url that the html report will be accessible at, once your
        # workflow uploads it.  Used in the pull request comment.
        report-url: https://julien-noblet.github.io/download-geofabrik/${{ github.ref_name}}.html

    - name: Generate coverage tree map
      env:
        REF_NAME: ${{ github.ref_name }}
        GOCOV_AGG_PATHNAME: ${{ steps.coverage.outputs.gocov-agg-pathname }}
      run: |
        mkdir -p "$REF_NAME"
        mkdir -p "/tmp/$REF_NAME"
        go run github.com/nikolaydubina/go-cover-treemap@latest -coverprofile "$GOCOV_AGG_PATHNAME" -only-folders=true > "/tmp/$REF_NAME.svg"
    - name: Commit files
      env:
        REF_NAME: ${{ github.ref_name }}
        REPORT_PATHNAME: ${{ steps.coverage.outputs.report-pathname }}
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git fetch --all
        git checkout gh-pages
        mkdir -p "$REF_NAME"
        cp -r "$REPORT_PATHNAME" "$REF_NAME.html"
        cp "/tmp/$REF_NAME.svg" "$REF_NAME.svg"
        git add "$REF_NAME.html" "$REF_NAME.svg"
        git commit -m "Upload coverage report"
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: gh-pages
  badge-generation:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
    - uses: actions/checkout@v7
      with:
        # default fetch-depth is insufficent to find previous coverage notes
        fetch-depth: 10

    - uses: cachix/install-nix-action@v32
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - uses: cachix/cachix-action@v17
      with:
        name: devenv
    - name: Install devenv
      run: nix profile add nixpkgs#devenv
    - name: Setup environment from devenv
      run: |
        set -o pipefail
        devenv --no-tui shell -- printenv PATH | tr ":" "\n" | while read -r p; do
          if [ -d "$p" ]; then
            echo "$p" >> "$GITHUB_PATH"
          fi
        done
        rm -f .git/hooks/pre-commit .git/hooks/pre-push .pre-commit-config.yaml

    - uses: gwatts/go-coverage-action@v2
      id: coverage
      continue-on-error: true
      with:
        # Optional coverage threshold
        # use fail-coverage to determine what should happen below this threshold
        coverage-threshold: 70

        # collect coverage for all packages beyond the one under test
        cover-pkg: ./...

        # Ignore code-generated files when calculating coverage totals
        ignore-pattern: |
          \.pb\.go$
          \_string\.go$

        # A url that the html report will be accessible at, once your
        # workflow uploads it.  Used in the pull request comment.
        report-url: https://julien-noblet.github.io/download-geofabrik/${{ github.ref_name}}.html

    - name: Create Awesome Badge
      uses: schneegans/dynamic-badges-action@v1.9.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: a509e15ea4734ca3e8e98f32ab5369c0
        filename: coverage.json
        label: Go Coverage
        message: ${{ steps.coverage.outputs.coverage-pct-1dp }}%
        color: ${{ steps.coverage.outputs.meets-threshold == 'true' && 'green' || 'red' }}
